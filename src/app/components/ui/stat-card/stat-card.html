<a
  [routerLink]="link()"
  class="group flex flex-col gap-space-sm rounded-lg border border-outline-variant bg-surface-container-lowest p-space-lg transition-colors hover:border-outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-container"
>
  <div class="flex items-center justify-between">
    <span class="text-label-md text-secondary">{{ label() }}</span>
    <span class="material-symbols-outlined text-[20px] text-outline group-hover:text-primary" aria-hidden="true">{{ icon() }}</span>
  </div>
  <span class="font-headline text-headline-xl tabular-nums text-on-surface">{{ value() }}</span>
  @if (hint()) {
    <span class="text-body-sm text-on-surface-variant">{{ hint() }}</span>
  }
</a>
