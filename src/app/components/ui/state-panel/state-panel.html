<div
  class="flex flex-col items-center justify-center gap-space-sm px-space-lg py-space-xl text-center"
  [attr.role]="kind() === 'error' ? 'alert' : 'status'"
  aria-live="polite"
>
  <span
    class="material-symbols-outlined text-[32px] text-outline"
    [class.text-danger]="kind() === 'error'"
    [class.animate-spin]="kind() === 'loading'"
    aria-hidden="true"
  >{{ text().icon }}</span>
  <p class="font-headline text-headline-sm text-on-surface">{{ text().title }}</p>
  @if (message()) {
    <p class="max-w-md text-body-sm text-on-surface-variant">{{ message() }}</p>
  }
</div>
