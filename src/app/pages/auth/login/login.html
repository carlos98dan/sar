<app-auth-layout title="Iniciar sesión" description="Accede con tu cuenta corporativa de SAR.">
  <app-section-card padding="xl">
    @if (errorMessage()) {
      <app-alert class="mb-space-md" tone="danger" icon="error" dense>{{ errorMessage() }}</app-alert>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-space-md">
      <app-form-field
        label="Correo corporativo"
        controlId="email"
        [error]="form.controls.email.touched && form.controls.email.invalid ? 'Ingresa un correo electrónico válido.' : ''"
      >
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="nombre@empresa.co"
          class="h-9 rounded border border-outline-variant bg-surface-container-lowest px-space-sm text-body-md placeholder:text-outline focus:border-primary-container focus:outline-none focus:ring-1 focus:ring-primary-container aria-invalid:border-danger"
          [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
          aria-describedby="email-error"
        />
      </app-form-field>

      <div class="flex flex-col gap-space-xs">
        <div class="flex items-center justify-between">
          <label for="password" class="text-label-md text-on-surface">Contraseña</label>
          <a routerLink="/recuperar-contrasena" class="text-label-md text-primary hover:underline">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="relative">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            class="h-9 w-full rounded border border-outline-variant bg-surface-container-lowest pl-space-sm pr-10 text-body-md focus:border-primary-container focus:outline-none focus:ring-1 focus:ring-primary-container"
            [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
            aria-describedby="password-error"
          />
          <button
            type="button"
            class="absolute inset-y-0 right-0 flex w-9 items-center justify-center text-secondary hover:text-on-surface"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            (click)="showPassword.set(!showPassword())"
          >
            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <p id="password-error" class="text-body-sm text-danger">Ingresa tu contraseña.</p>
        }
      </div>

      <label class="flex items-center gap-space-sm text-body-md text-on-surface-variant">
        <input type="checkbox" formControlName="rememberSession" class="h-4 w-4 rounded border-outline-variant accent-primary-container" />
        Mantener sesión iniciada en este equipo
      </label>

      <button type="submit" appButton block class="mt-space-sm" [disabled]="submitting()">
        @if (submitting()) {
          <span class="material-symbols-outlined animate-spin text-[18px]" aria-hidden="true">progress_activity</span>
          <span>Verificando…</span>
        } @else {
          <span>Iniciar sesión</span>
        }
      </button>
    </form>
  </app-section-card>

  <p class="mt-space-lg text-center text-body-sm text-on-surface-variant">
    ¿Necesitas acceso? Contacta a
    <a href="mailto:soporte@empresademo.co" class="font-medium text-primary hover:underline">soporte</a>.
    El acceso lo administra tu organización.
  </p>
</app-auth-layout>
