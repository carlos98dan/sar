<app-auth-layout title="Recuperar contraseña" description="Te enviaremos un enlace para restablecer tu contraseña.">
  <app-section-card padding="xl">
    @if (confirmation()) {
      <div role="status" class="flex flex-col items-center gap-space-md text-center">
        <span class="material-symbols-outlined text-[32px] text-success" aria-hidden="true">mark_email_read</span>
        <p class="text-body-md text-on-surface">{{ confirmation() }}</p>
        <a routerLink="/login" class="text-label-md font-medium text-primary hover:underline">Volver a iniciar sesión</a>
      </div>
    } @else {
      @if (errorMessage()) {
        <app-alert class="mb-space-md" tone="danger" dense>{{ errorMessage() }}</app-alert>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-space-md">
        <app-form-field
          label="Correo corporativo"
          controlId="email"
          [error]="form.controls.email.touched && form.controls.email.invalid ? 'Ingresa un correo electrónico válido.' : ''"
        >
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="username"
            placeholder="nombre@empresa.co"
            class="h-9 rounded border border-outline-variant bg-surface-container-lowest px-space-sm text-body-md placeholder:text-outline focus:border-primary-container focus:outline-none focus:ring-1 focus:ring-primary-container"
            [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
            aria-describedby="email-error"
          />
        </app-form-field>

        <button type="submit" appButton block [disabled]="submitting()">
          @if (submitting()) {
            <span class="material-symbols-outlined animate-spin text-[18px]" aria-hidden="true">progress_activity</span>
            <span>Enviando…</span>
          } @else {
            <span>Enviar enlace</span>
          }
        </button>

        <a routerLink="/login" class="text-center text-label-md text-secondary hover:text-on-surface">Volver a iniciar sesión</a>
      </form>
    }
  </app-section-card>
</app-auth-layout>
