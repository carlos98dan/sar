<app-page-header title="Reservas" description="Solicitudes y reservas de todas las sedes de la organización.">
  <button type="button" appButton>
    <span class="material-symbols-outlined text-[18px]" aria-hidden="true">add</span>
    Nueva reserva
  </button>
</app-page-header>

<div class="mb-space-md flex flex-col gap-space-md">
  <div class="flex flex-col gap-space-sm md:flex-row md:items-center md:justify-between">
    <app-filter-chips label="Filtrar por estado" [options]="statusOptions" [(value)]="status" />

    <div class="flex items-center gap-space-sm">
      <app-search-input
        label="Buscar reservas"
        placeholder="Buscar por código, recurso o solicitante"
        class="md:w-72"
        [(value)]="query"
      />
      @if (query() || status() !== 'all') {
        <button type="button" appButton variant="ghost" class="shrink-0" (click)="clearFilters()">
          Limpiar filtros
        </button>
      }
    </div>
  </div>
</div>

@if (reservations(); as state) {
  @if (state.status === 'loading') {
    <app-state-panel kind="loading" />
  } @else if (state.status === 'error') {
    <app-state-panel kind="error" [message]="state.message" />
  } @else if (filtered().length === 0) {
    <app-state-panel kind="empty" message="Ajusta la búsqueda o el filtro de estado para ver otras reservas." />
  } @else {
    <app-reservation-table
      caption="Listado de reservas"
      [reservations]="filtered()"
      [summary]="filtered().length + ' de ' + state.data.length + ' reservas'"
    />
  }
}
