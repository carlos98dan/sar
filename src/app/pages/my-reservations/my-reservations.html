<app-page-header
  title="Mis reservas"
  description="Reservas que tú solicitaste, en todas las sedes."
/>

@if (data(); as state) {
  @if (state.status === 'loading') {
    <app-state-panel kind="loading" />
  } @else if (state.status === 'error') {
    <app-state-panel kind="error" [message]="state.message" />
  } @else if (mine().length === 0) {
    <app-state-panel kind="empty" message="Todavía no has solicitado reservas." />
  } @else {
    <div
      class="mb-space-md flex flex-col gap-space-sm md:flex-row md:items-center md:justify-between"
    >
      <app-filter-chips label="Filtrar por estado" [options]="statusOptions" [(value)]="status" />

      <div class="flex items-center gap-space-sm">
        <app-search-input
          label="Buscar mis reservas"
          placeholder="Buscar por código, recurso o título"
          class="md:w-72"
          [(value)]="query"
        />
        @if (query() || status() !== 'all') {
          <button type="button" appButton variant="ghost" class="shrink-0" (click)="clearFilters()">
            Limpiar filtros
          </button>
        }
      </div>
    </div>

    @if (filtered().length === 0) {
      <app-state-panel
        kind="empty"
        message="Ajusta la búsqueda o el filtro de estado para ver otras reservas."
      />
    } @else {
      <app-reservation-table
        caption="Mis reservas"
        [reservations]="filtered()"
        [summary]="filtered().length + ' de ' + mine().length + ' reservas'"
      />
    }
  }
}
