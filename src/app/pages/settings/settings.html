<app-page-header title="Configuración" description="Datos generales de la organización, zona horaria y formatos regionales.">
  <button type="button" appButton [disabled]="saving()" (click)="save()">
    @if (saving()) {
      <span class="material-symbols-outlined animate-spin text-[18px]" aria-hidden="true">progress_activity</span>
    }
    Guardar cambios
  </button>
</app-page-header>

@if (saved()) {
  <app-alert class="mb-space-md" icon="check_circle">Configuración guardada.</app-alert>
}
@if (errorMessage()) {
  <app-alert class="mb-space-md" tone="danger" icon="error">{{ errorMessage() }}</app-alert>
}

<form [formGroup]="form" novalidate class="grid gap-gutter xl:grid-cols-3">
  <app-section-card class="xl:col-span-2">
    <h2 class="mb-space-md font-headline text-headline-sm text-on-surface">Identificación</h2>
    <div class="grid gap-space-md sm:grid-cols-2">
      <app-form-field
        class="sm:col-span-2"
        label="Nombre de la organización"
        controlId="org-name"
        [error]="form.controls.name.touched && form.controls.name.invalid ? 'Ingresa el nombre de la organización (máximo 120 caracteres).' : ''"
      >
        <input id="org-name" formControlName="name" class="h-9 rounded border border-outline-variant bg-surface-container-lowest px-space-sm text-body-md focus:border-primary-container focus:outline-none focus:ring-1 focus:ring-primary-container" [attr.aria-invalid]="form.controls.name.touched && form.controls.name.invalid" />
      </app-form-field>
      <app-form-field label="NIT" controlId="org-tax">
        <input id="org-tax" formControlName="taxId" class="h-9 rounded border border-outline-variant bg-surface-container-lowest px-space-sm text-body-md tabular-nums focus:border-primary-container focus:outline-none focus:ring-1 focus:ring-primary-container" />
      </app-form-field>
    </div>
  </app-section-card>

  <app-section-card>
    <h2 class="mb-space-md font-headline text-headline-sm text-on-surface">Formatos regionales</h2>
    <div class="flex flex-col gap-space-md">
      <app-form-field label="Zona horaria" controlId="org-tz">
        <select id="org-tz" formControlName="timezone" class="h-9 rounded border border-outline-variant bg-surface-container-lowest px-space-sm text-body-md focus:border-primary-container focus:outline-none focus:ring-1 focus:ring-primary-container">
          @for (zone of timezones; track zone) {
            <option [value]="zone">{{ zone }}</option>
          }
        </select>
      </app-form-field>
      <app-form-field label="Moneda" controlId="org-currency">
        <select id="org-currency" formControlName="currency" class="h-9 rounded border border-outline-variant bg-surface-container-lowest px-space-sm text-body-md focus:border-primary-container focus:outline-none focus:ring-1 focus:ring-primary-container">
          @for (currency of currencies; track currency) {
            <option [value]="currency">{{ currency }}</option>
          }
        </select>
      </app-form-field>
      <app-form-field label="Formato de fecha" controlId="org-date">
        <select id="org-date" formControlName="dateFormat" class="h-9 rounded border border-outline-variant bg-surface-container-lowest px-space-sm text-body-md focus:border-primary-container focus:outline-none focus:ring-1 focus:ring-primary-container">
          @for (format of dateFormats; track format) {
            <option [value]="format">{{ format }}</option>
          }
        </select>
      </app-form-field>
      <app-form-field label="Formato de hora" controlId="org-time">
        <select id="org-time" formControlName="timeFormat" class="h-9 rounded border border-outline-variant bg-surface-container-lowest px-space-sm text-body-md focus:border-primary-container focus:outline-none focus:ring-1 focus:ring-primary-container">
          @for (format of timeFormats; track format) {
            <option [value]="format">{{ format }}</option>
          }
        </select>
      </app-form-field>
    </div>
  </app-section-card>
</form>
